format_version: '26'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios
meta:
  bitrise.io:
    stack: osx-xcode-latest-stable

workflows:
  personal_device:
    description: Build the standalone unsigned iOS device app for local private provisioning and Sideloadly installation.
    steps:
      - git-clone@8:
          repository: https://github.com/cryptostoner94/SuperCraftOS.git
          clone_dir: /home/bitrise/project
      - script@1:
          title: Compile and verify the iPhone app
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                python3 scripts/package_ipad.py
                if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
                python3 scripts/xcode_project.py
                DERIVED="$BITRISE_SOURCE_DIR/build/PersonalDevice"
                xcodebuild -project ios_app_dist/ci_xcode/SuperCraftOS.xcodeproj -scheme SuperCraftOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build
                APP="$DERIVED/Build/Products/Release-iphoneos/SuperCraftOS.app"
                test -d "$APP"
                mkdir -p "$BITRISE_SOURCE_DIR/build/Artifacts"
                ditto "$APP" "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS-iOS-Device-unsigned.app.zip"
                ditto "ios_app_dist/YourApp.swiftpm.zip" "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS-iOS-Device-WithKeyboard-unsigned.app.zip"

  run_tests:
    description: Verify Swift Playgrounds bundle, portable Swift logic, compile iOS app and keyboard for Simulator, compile both for iOS device, run UI and transport tests.
    steps:
      - git-clone@8:
          repository: https://github.com/cryptostoner94/SuperCraftOS.git
          clone_dir: /home/bitrise/project
      - script@1:
          title: Compile and verify the iPhone app
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                python3 scripts/package_ipad.py
                if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
                python3 scripts/xcode_project.py
                DERIVED="$BITRISE_SOURCE_DIR/build/PersonalDevice"
                xcodebuild -project ios_app_dist/ci_xcode/SuperCraftOS.xcodeproj -scheme SuperCraftOS -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build
                APP="$DERIVED/Build/Products/Release-iphoneos/SuperCraftOS.app"
                test -d "$APP"
                mkdir -p "$BITRISE_SOURCE_DIR/build/Artifacts"
                ditto "$APP" "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS-iOS-Device-unsigned.app.zip"
                ditto "ios_app_dist/YourApp.swiftpm.zip" "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS-iOS-Device-WithKeyboard-unsigned.app.zip"
      - script@1:
          title: Run Swift package tests
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                cd swift-verification
                swift test --package-path . --no-build

  mission_acceptance:
    description: Compile mission workspace and drive all app screens on iPad and iPhone using authenticated offline fixtures.
    steps:
      - git-clone@8:
          repository: https://github.com/cryptostoner94/SuperCraftOS.git
          clone_dir: /home/bitrise/project
      - script@1:
          title: Compile and verify the iPhone app
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                python3 scripts/package_ipad.py
                if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
                python3 scripts/xcode_project.py
                DERIVED="$BITRISE_SOURCE_DIR/build/PersonalDevice"
                xcodebuild -project ios_app_dist/ci_xcode/SuperCraftOS.xcodeproj -scheme SuperCraftOS -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build
                APP="$DERIVED/Build/Products/Release-iphoneos/SuperCraftOS.app"
                test -d "$APP"
                mkdir -p "$BITRISE_SOURCE_DIR/build/Artifacts"
                ditto "$APP" "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS-iOS-Device-unsigned.app.zip"
                ditto "ios_app_dist/YourApp.swiftpm.zip" "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS-iOS-Device-WithKeyboard-unsigned.app.zip"
      - script@1:
          title: Run Swift package tests
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                cd swift-verification
                swift test --package-path . --no-build

  ipa_release:
    description: Build and verify iOS IPA.
    steps:
      - git-clone@8:
          repository: https://github.com/cryptostoner94/SuperCraftOS.git
          clone_dir: /home/bitrise/project
      - script@1:
          title: Compile and verify the iPhone app
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                python3 scripts/package_ipad.py
                if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
                python3 scripts/xcode_project.py
                DERIVED="$BITRISE_SOURCE_DIR/build/PersonalDevice"
                xcodebuild -project ios_app_dist/ci_xcode/SuperCraftOS.xcodeproj -scheme SuperCraftOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build
                APP="$DERIVED/Build/Products/Release-iphoneos/SuperCraftOS.app"
                mkdir -p "$BITRISE_SOURCE_DIR/build/Artifacts"
                ditto "$APP" "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS-iOS-Device-unsigned.app.zip"
                ditto "ios_app_dist/YourApp.swiftpm.zip" "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS-iOS-Device-WithKeyboard-unsigned.app.zip"
      - script@1:
          title: Build IPA
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                xcodebuild -exportArchive -archivePath "$BITRISE_SOURCE_DIR/build/Build/Products/Release-iphoneos/SuperCraftOS.xcarchive" -exportPath "$BITRISE_SOURCE_DIR/build/Artifacts" -exportOptionsPlist ios_app_dist/ci_xcode/ExportOptions-development.plist
                mkdir -p "$BITRISE_SOURCE_DIR/build/Artifacts"
                ditto "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS.ipa" "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS.ipa"

  live_backend_contract:
    description: Explicit read-only gateway smoke tests.
    steps:
      - git-clone@8:
          repository: https://github.com/cryptostoner94/SuperCraftOS.git
          clone_dir: /home/bitrise/project
      - script@1:
          title: Run backend contract tests
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                python3 -m pytest backend/tests/ -v

  primary:
    description: Primary Bitrise CLI workflow. Generates the Xcode project from
      the XcodeGen spec, builds the SuperCraftOS app for iOS device (unsigned), and
      exports a production-ready unsigned .ipa ready for Sideloadly signing with
      your connected iCloud Apple ID. Uses Bitrise Build Cache for Xcode to speed up
      repeated builds.
    steps:
      - git-clone@8:
          repository: https://github.com/cryptostoner94/opencode-supercraftos.git
          clone_dir: /home/bitrise/project
          reset_repository: true
      - script@1:
          title: Package Swift app bundle
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                python3 scripts/package_ipad.py
      - script@1:
          title: Install XcodeGen and generate the Xcode project
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
                python3 scripts/xcode_project.py
      - activate-build-cache-for-xcode@1:
          title: Activate Bitrise Build Cache for Xcode
      - script@1:
          title: Build unsigned iOS device app
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                DERIVED="$BITRISE_SOURCE_DIR/build/PersonalDevice"
                xcodebuild -project ios_app_dist/ci_xcode/SuperCraftOS.xcodeproj -scheme SuperCraftOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO build
                APP="$DERIVED/Build/Products/Release-iphoneos/SuperCraftOS.app"
                test -d "$APP"
                mkdir -p "$BITRISE_SOURCE_DIR/build/Artifacts"
                ditto "$APP" "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS-iOS-Device-unsigned.app.zip"
      - script@1:
          title: Create unsigned production IPA
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                DERIVED="$BITRISE_SOURCE_DIR/build/PersonalDevice"
                APP="$DERIVED/Build/Products/Release-iphoneos/SuperCraftOS.app"
                test -d "$APP"
                IPA_DIR="$BITRISE_SOURCE_DIR/build/IPA-Staging"
                rm -rf "$IPA_DIR"
                mkdir -p "$IPA_DIR/Payload"
                cp -R "$APP" "$IPA_DIR/Payload/"
                cd "$IPA_DIR"
                zip -r "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS.ipa" Payload
                test -f "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS.ipa"
      - script@1:
          title: Copy IPA to deploy directory
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                cp "$BITRISE_SOURCE_DIR/build/Artifacts/SuperCraftOS.ipa" "$BITRISE_DEPLOY_DIR/"
      - deploy-to-bitrise-io@2:
          inputs:
            - is_compress: true

  signed_development:
    description: Build and export a signed development IPA using your free personal iCloud Apple ID. Installs directly on registered devices without TestFlight or the App Store.
    steps:
      - git-clone@8:
          repository: https://github.com/cryptostoner94/opencode-supercraftos.git
          clone_dir: /home/bitrise/project
          reset_repository: true
      - script@1:
          title: Generate the Xcode project
          inputs:
            - content: |
                #!/bin/bash
                set -euo pipefail
                python3 scripts/package_ipad.py
                if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
                xcodegen generate --spec ios_app_dist/ci_xcode/project.yml
      - activate-build-cache-for-xcode@1:
          title: Activate Bitrise Build Cache for Xcode
      - manage-ios-code-signing@2.4.0:
          title: Manage iOS Code Signing
          inputs:
            - apple_service_connection: apple-id
            - scheme: SuperCraftOS
            - project_path: ios_app_dist/ci_xcode/SuperCraftOS.xcodeproj
            - distribution_method: development
            - register_test_devices: "yes"
      - xcode-archive@6.2.0:
          title: Xcode Archive & Export for iOS
          inputs:
            - project_path: ios_app_dist/ci_xcode/SuperCraftOS.xcodeproj
            - scheme: SuperCraftOS
            - distribution_method: development
            - automatic_code_signing: apple-id
            - register_test_devices: "yes"
      - deploy-to-bitrise-io@2:
          inputs:
            - is_compress: true