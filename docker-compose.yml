services:
  supercraftos:
    image: ${SUPERCRAFTOS_IMAGE:-supercraftos:local}
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    # Linux only. The app intentionally rejects non-loopback binds and Host headers.
    # A bridge port mapping cannot reach a listener bound to container loopback.
    network_mode: host
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTO_UPGRADE: "0"
      SYNC_CAPABILITIES: "0"
    volumes:
      - supercraftos-data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  supercraftos-data:
