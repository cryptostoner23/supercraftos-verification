name: SuperCraftOSConcept2
options:
  bundleIdPrefix: com.supercraftos
  deploymentTarget:
    iOS: "17.0"
targets:
  SuperCraftOSConcept2:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "Concept2UITests"
      - path: ../SharedBackend.swift
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        SUPERCRAFTOSAccessKey: "$(SUPERCRAFTOS_ACCESS_KEY)"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supercraftos.concept2
        PRODUCT_NAME: SuperCraftOSConcept2
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Concept 2
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPERCRAFTOS_ACCESS_KEY: "$(SUPERCRAFTOS_ACCESS_KEY)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  Concept2UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Concept2UITests
    dependencies:
      - target: SuperCraftOSConcept2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supercraftos.concept2.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: SuperCraftOSConcept2
schemes:
  Concept2UITests:
    build:
      targets:
        Concept2UITests: [test]
    test:
      config: Debug
      targets:
        - Concept2UITests
  SuperCraftOSConcept2:
    build:
      targets:
        SuperCraftOSConcept2: all
    run:
      config: Debug
    test:
      config: Debug
