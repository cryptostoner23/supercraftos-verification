name: SuperCraftOSConcept6
options:
  bundleIdPrefix: com.supercraftos
  deploymentTarget:
    iOS: "17.0"
targets:
  SuperCraftOSConcept6:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "Concept6UITests"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supercraftos.concept6
        PRODUCT_NAME: SuperCraftOSConcept6
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Concept 6
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  Concept6UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Concept6UITests
    dependencies:
      - target: SuperCraftOSConcept6
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supercraftos.concept6.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: SuperCraftOSConcept6
schemes:
  Concept6UITests:
    build:
      targets:
        Concept6UITests: [test]
    test:
      config: Debug
      targets:
        - Concept6UITests
  SuperCraftOSConcept6:
    build:
      targets:
        SuperCraftOSConcept6: all
    run:
      config: Debug
    test:
      config: Debug
