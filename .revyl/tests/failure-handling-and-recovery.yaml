build:
  version_id: 834300f6-ff12-4a10-bf70-84eba1392252
tags:
  - smoke
  - failure
blocks:
  - step_type: tap
    description: Attempt an action that will fail (invalid input, network error)
  - step_type: tap
    description: Verify app shows appropriate error message
