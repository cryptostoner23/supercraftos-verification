name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ios-ipa.yml'
      - 'ios_app_dist/**'
      - 'swift-verification/**'
      - 'scripts/**'

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Generate and validate project
        run: |
          set -euo pipefail
          python3 scripts/package_ipad.py
          python3 scripts/xcode_project.py
      - name: Build unsigned iOS device app
        run: |
          set -euo pipefail
          xcodebuild -project ios_app_dist/ci_xcode/SuperCraftOS.xcodeproj -scheme SuperCraftOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/SuperCraftOS-DerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Package and verify IPA
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/package_ipa.py "$RUNNER_TEMP/SuperCraftOS-DerivedData/Build/Products/Release-iphoneos/SuperCraftOS.app" dist/SuperCraftOS-iOS-Device-unsigned.ipa
          python3 scripts/verify_ios_artifacts.py dist/SuperCraftOS-iOS-Device-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SuperCraftOS-iOS-Device-unsigned
          path: dist/SuperCraftOS-iOS-Device-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
